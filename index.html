<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar User - Supabase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Daftar User</h1>

    <form id="form-tambah">
      <input type="text" id="input-nama" placeholder="Nama" required />
      <input type="email" id="input-email" placeholder="Email" required />
      <input type="password" id="input-password" placeholder="Password" required />
      <button type="submit">Tambah User</button>
    </form>

    <p id="status"></p>

    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Email</th>
          <th>Dibuat</th>
        </tr>
      </thead>
      <tbody id="tabel-user">
        <tr><td colspan="3">Memuat data...</td></tr>
      </tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
